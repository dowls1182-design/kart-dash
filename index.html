<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>부릉부릉 카트 대시</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root{--ink:#2b2338;--pink:#ff6b9d;--pink-deep:#e84f86;--yellow:#ffd23f;--sky:#6bd3ff;--disp:'Jua',system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;height:100%;overflow:hidden;font-family:var(--disp)}
body{background:#20222f;display:flex;align-items:center;justify-content:center}
#stage{position:relative;background:#20222f;overflow:hidden}
canvas#c{display:block;width:100%;height:100%;touch-action:none}

#hud{position:absolute;top:0;left:0;right:0;padding:10px 14px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;color:#fff;text-shadow:0 2px 4px rgba(0,0,0,.45);z-index:5}
#hud .dist{font-size:30px;line-height:1}
#hud .dist small{font-size:15px;opacity:.85}
#hud .coins{font-size:19px;margin-top:4px}
#hud .spd{font-size:16px;margin-top:3px;color:var(--yellow)}
#boostWrap{width:118px}
#boostBar{height:12px;background:rgba(255,255,255,.25);border-radius:8px;overflow:hidden;border:2px solid rgba(255,255,255,.5)}
#boostFill{height:100%;width:0%;background:linear-gradient(90deg,var(--yellow),#ff8c1a)}
#boostLbl{font-size:13px;text-align:right;margin-bottom:3px}

#boostBtn{position:absolute;right:16px;bottom:22px;z-index:6;width:84px;height:84px;border-radius:50%;border:4px solid #fff;color:#fff;font-family:var(--disp);font-size:16px;background:radial-gradient(circle at 35% 30%,#ffcf4d,#ff8c1a);box-shadow:0 6px 16px rgba(255,140,0,.5);display:none;align-items:center;justify-content:center;cursor:pointer;line-height:1.15}
#boostBtn:active{transform:scale(.93)}
#sndBtn{position:absolute;left:12px;bottom:24px;z-index:8;width:44px;height:44px;border-radius:50%;border:2px solid rgba(255,255,255,.5);background:rgba(0,0,0,.4);color:#fff;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center}
#sndBtn:active{transform:scale(.92)}
#boostBtn.ready{animation:pulse 1s infinite}
#boostBtn:disabled{filter:grayscale(.7) brightness(.85);border-color:#ccc}
@keyframes pulse{50%{box-shadow:0 6px 26px rgba(255,200,0,.95)}}

#quitBtn{position:absolute;top:12px;left:50%;transform:translateX(-50%);z-index:6;display:none;font-family:var(--disp);font-size:14px;color:#fff;background:rgba(0,0,0,.4);border:2px solid rgba(255,255,255,.5);border-radius:20px;padding:6px 16px;cursor:pointer}
#quitBtn:active{transform:translateX(-50%) scale(.94)}
#biomeBanner{position:absolute;top:84px;left:50%;transform:translateX(-50%);z-index:7;background:rgba(0,0,0,.55);color:#fff;font-size:22px;padding:8px 20px;border-radius:30px;opacity:0;transition:opacity .35s;pointer-events:none;white-space:nowrap}
#biomeBanner.show{opacity:1}

.screen{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#fff;padding:22px;background:linear-gradient(180deg,rgba(28,28,42,.62),rgba(28,28,42,.86));overflow-y:auto}
#shop,#rank,#over{display:none}
#shop,#rank{justify-content:flex-start;padding-top:18px}
.shopClose{position:sticky;top:0;align-self:flex-end;z-index:20;font-family:var(--disp);border:none;cursor:pointer;font-size:16px;color:#fff;background:var(--pink-deep);padding:9px 18px;border-radius:16px;box-shadow:0 4px 10px rgba(0,0,0,.35)}
.shopClose:active{transform:scale(.94)}
.title{font-size:38px;color:#fff;text-shadow:0 3px 0 var(--pink-deep),0 6px 12px rgba(0,0,0,.4);margin-bottom:4px;line-height:1.05}
.emoji{font-size:50px;filter:drop-shadow(0 6px 8px rgba(0,0,0,.35))}
.sub{font-size:14.5px;opacity:.92;line-height:1.5;margin:8px 0 16px;max-width:300px}
.big{font-family:var(--disp);border:none;cursor:pointer;color:#fff;font-size:23px;background:linear-gradient(180deg,var(--pink),var(--pink-deep));padding:14px 32px;border-radius:18px;box-shadow:0 6px 0 #c93b70;transition:transform .08s,box-shadow .08s}
.big:active{transform:translateY(4px);box-shadow:0 2px 0 #c93b70}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:12px}
.mbtn{font-family:var(--disp);border:none;cursor:pointer;font-size:17px;padding:11px 18px;border-radius:14px;background:#fff;color:var(--pink-deep);box-shadow:0 4px 0 #f2d6e2}
.mbtn:active{transform:translateY(3px);box-shadow:0 1px 0 #f2d6e2}
.mbtn.blue{background:var(--sky);color:#fff;box-shadow:0 4px 0 #3aa9d6}
.nick{font-family:var(--disp);font-size:18px;text-align:center;border:none;border-radius:12px;padding:10px 14px;width:210px;margin:2px 0 6px;outline:3px solid transparent}
.nick:focus{outline-color:var(--sky)}
.wallet{font-size:18px;margin:6px 0;background:rgba(0,0,0,.28);padding:6px 16px;border-radius:20px}
.best{font-size:15px;margin-top:8px;opacity:.92}
.hint{font-size:12.5px;opacity:.75;margin-top:14px;line-height:1.5}

.scorebox{background:rgba(0,0,0,.3);border-radius:18px;padding:14px 26px;margin:6px 0 10px}
.scorebox .n{font-size:42px;color:var(--yellow);line-height:1}
.scorebox .l{font-size:13.5px;opacity:.85;margin-top:3px}

/* 상점 */
#shopGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;width:100%;max-width:400px;margin:6px 0 10px}
.sk{background:rgba(255,255,255,.1);border-radius:16px;padding:10px 8px 12px;text-align:center;border:3px solid transparent}
.sk.sel{border-color:var(--yellow);background:rgba(255,210,63,.16)}
.sk canvas{display:block;margin:0 auto 4px}
.sk .kn{font-size:16px}
.sk .kp{font-size:13px;opacity:.9;margin:2px 0 7px}
.sk button{font-family:var(--disp);border:none;cursor:pointer;font-size:14px;padding:7px 0;width:100%;border-radius:10px}
.sk .buy{background:var(--yellow);color:#5a4500}
.sk .buy:disabled{background:#6b6b78;color:#bbb;cursor:default}
.sk .use{background:#fff;color:var(--pink-deep)}
.sk .using{background:var(--pink-deep);color:#fff;cursor:default}

/* 랭킹 */
#rankList{width:100%;max-width:360px;margin:8px 0 6px}
.rk{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.1);border-radius:12px;padding:9px 14px;margin-bottom:7px;font-size:16px}
.rk .no{width:30px;font-size:18px;color:var(--yellow);text-align:center}
.rk .nm{flex:1;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rk .sc{color:#fff;font-variant-numeric:tabular-nums}
.rk.me{outline:2px solid var(--sky)}

.byline{position:absolute;bottom:10px;left:0;right:0;text-align:center;font-size:11px;opacity:.5;color:#fff;pointer-events:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="stage">
  <canvas id="c"></canvas>
  <div id="hud">
    <div>
      <div class="dist"><span id="dist">0</span><small>m</small></div>
      <div class="coins">🪙 <span id="coins">0</span></div>
      <div class="spd">🏁 <span id="spd">0</span> km/h</div>
    </div>
    <div id="boostWrap">
      <div id="boostLbl">부스터</div>
      <div id="boostBar"><div id="boostFill"></div></div>
    </div>
  </div>
  <div id="biomeBanner"></div>
  <button id="quitBtn" onclick="quitRun()">⏹ 나가기</button>
  <button id="boostBtn" onclick="useBoost()">부스터 🚀</button>
  <button id="sndBtn" onclick="toggleSound()">🔊</button>

  <!-- 시작 -->
  <div class="screen" id="start" style="display:flex">
    <div class="emoji">🏎️💨</div>
    <div class="title">부릉부릉<br>카트 대시</div>
    <div class="sub">손가락으로 카트를 좌우로!<br>피하고, 코인 먹고, 🚀 부스터!</div>
    <input class="nick" id="nick" maxlength="8" placeholder="닉네임 (=내 계정)">
    <div style="font-size:12px;opacity:.85;margin:0 0 8px;max-width:280px;line-height:1.45">🔑 닉네임이 곧 계정이에요!<br>같은 닉네임이면 다른 기기·브라우저에서도<br>코인·스킨이 그대로 이어져요</div>
    <div class="wallet">🪙 내 코인 <b id="walletStart">0</b></div>
    <button class="big" onclick="startGame()">출발! 🏁</button>
    <div class="row">
      <button class="mbtn" onclick="openShop()">🎨 스킨 상점</button>
      <button class="mbtn blue" onclick="openRank()">🏆 랭킹</button>
    </div>
    <div class="best" id="startBest"></div>
    <div class="hint">📱 화면 드래그 · 🖥 방향키/마우스 · 스페이스=부스터</div>
  </div>

  <!-- 상점 -->
  <div class="screen" id="shop">
    <button class="shopClose" onclick="closeOverlays()">✕ 닫기</button>
    <div class="title" style="font-size:30px">🎨 스킨 상점</div>
    <div class="wallet">🪙 내 코인 <b id="walletShop">0</b></div>
    <div id="shopGrid"></div>
    <button class="mbtn" onclick="closeOverlays()">← 뒤로</button>
    <div class="hint">코인은 달리면서 모을 수 있어!</div>
  </div>

  <!-- 랭킹 -->
  <div class="screen" id="rank">
    <div class="title" style="font-size:30px">🏆 전체 랭킹 TOP</div>
    <div id="rankList"><div class="rk"><div class="nm">불러오는 중…</div></div></div>
    <button class="mbtn" onclick="closeOverlays()">← 뒤로</button>
  </div>

  <!-- 게임오버 -->
  <div class="screen" id="over">
    <div class="emoji" id="overEmoji">💥</div>
    <div class="title" id="overTitle">크래시!</div>
    <div class="scorebox">
      <div class="n"><span id="finalDist">0</span>m</div>
      <div class="l">🪙 +<span id="finalCoins">0</span> · 최종 점수 <span id="finalScore">0</span></div>
    </div>
    <div class="best" id="overBest"></div>
    <div id="unlockMsg" style="display:none;background:rgba(255,210,63,.2);border:2px solid var(--yellow);border-radius:14px;padding:10px 16px;margin:8px 0;font-size:16px;line-height:1.5"></div>
    <div id="overRank" style="width:100%;max-width:340px;margin:8px 0"></div>
    <button class="big" onclick="startGame()">다시 달리기 🔄</button>
    <div class="row">
      <button class="mbtn" onclick="openShop()">🎨 상점</button>
      <button class="mbtn blue" onclick="goHome()">처음으로</button>
    </div>
    <div class="hint" id="overMsg"></div>
  </div>

  <div class="byline">🐹 친구 진화 세계관 · 카트 대시</div>
</div>

<script>
/* ============ 저장 데이터 ============ */
const SAVE={coins:0, owned:["pink","sky"], skin:"pink", nick:"", best:0};
function load(){ try{Object.assign(SAVE,JSON.parse(localStorage.getItem("kartSaveV2")||"{}"));}catch(e){}
  if(!SAVE.owned.includes("pink"))SAVE.owned.push("pink");
  if(!SAVE.owned.includes("sky"))SAVE.owned.push("sky"); }
function save(){ try{localStorage.setItem("kartSaveV2",JSON.stringify(SAVE));}catch(e){} }
load();

/* ============ 스킨 10종 ============ */
const SKINS=[
  {id:"pink",  name:"핑크팝",   price:0,    body:"#ff5a8a",roof:"#ff7ba3",win:"#bfe9ff",spoiler:"#e84f86"},
  {id:"sky",   name:"하늘이",   price:0,    body:"#4db6ff",roof:"#7fccff",win:"#eaf7ff",spoiler:"#2f97e0"},
  {id:"lemon", name:"레몬소다", price:400,  body:"#ffd23f",roof:"#ffe27a",win:"#d6f0ff",spoiler:"#e0a800"},
  {id:"mint",  name:"민트초코", price:400,  body:"#57d6a3",roof:"#84e6c0",win:"#eafff6",spoiler:"#2fae82"},
  {id:"grape", name:"포도알",   price:800,  body:"#a678e8",roof:"#c2a0f2",win:"#f2eaff",spoiler:"#7d4fc4"},
  {id:"berry", name:"딸기우유", price:1500, body:"#ffc9dc",roof:"#ffdcea",win:"#fff5f9",spoiler:"#f2a9c2",pattern:"stripe",fx:true},
  {id:"flame", name:"불꽃질주", price:2500, body:"#ff7a2e",roof:"#ff9e57",win:"#fff0e0",spoiler:"#d94f00",pattern:"flame",fx:true},
  {id:"carbon",name:"카본레이서",price:4000, body:"#23242c",roof:"#3a3b46",win:"#9fb0c0",spoiler:"#ff3b3b",pattern:"carbon",fx:true},
  {id:"rainbow",name:"무지개",  price:7000, body:"#ff5a8a",roof:"#ff7ba3",win:"#ffffff",spoiler:"#7d4fc4",pattern:"rainbow",fx:true},
  {id:"gold",  name:"황금카트", price:15000,body:"#ffcf4d",roof:"#ffe08a",win:"#fff6d6",spoiler:"#d99a00",pattern:"gold",fx:true},
  {id:"potato",name:"꼬질한 카피감자",price:3000, shape:"potato", body:"#d9b06a",roof:"#c99a50",win:"#dff0ff",spoiler:"#a87d3a",fx:true},
  {id:"duck",  name:"사랑에 빠진 오리",price:3000, shape:"duck", body:"#ffe07a",roof:"#ffd24d",win:"#ffffff",spoiler:"#f0b23a",fx:true},
  // ===== 지역 완주 해금 스킨 (차종별) =====
  {id:"tractor",name:"풀숲 트랙터", shape:"tractor", body:"#4caf50",roof:"#66bb6a",win:"#dff5d6",spoiler:"#2e7d32", fx:true, unlock:{dist:300, label:"풀숲 통과 시 해금"}},
  {id:"jeep",   name:"사막 지프",   shape:"jeep",    body:"#c2a35a",roof:"#d8bd7c",win:"#eef4d8",spoiler:"#8a6d2f", fx:true, unlock:{dist:600, label:"사막 통과 시 해금"}},
  {id:"snow",   name:"빙하 SUV",    shape:"suv",     body:"#eaf6ff",roof:"#ffffff",win:"#bfe6fb",spoiler:"#8fd0ee", fx:true, unlock:{dist:900, label:"빙하 통과 시 해금"}},
  {id:"super",  name:"시티 슈퍼카", shape:"super",   body:"#e0322f",roof:"#2a2a33",win:"#9fdcff",spoiler:"#111114", fx:true, unlock:{dist:1200,label:"도시 통과 시 해금"}},
  {id:"dump",   name:"정글 덤프트럭",shape:"truck",   body:"#3f8a4a",roof:"#2f6a38",win:"#d6ffe0",spoiler:"#255a2e", fx:true, unlock:{dist:1500,label:"정글 통과 시 해금"}},
  {id:"hanok",  name:"청기와 세단", shape:"sedan",   body:"#1b1c23",roof:"#2f9aa0",win:"#cfe4f0",spoiler:"#c2cad6", fx:true, unlock:{dist:1800,label:"한옥 통과 시 해금"}},
];
const SKIN=id=>SKINS.find(s=>s.id===id)||SKINS[0];

/* ============ 지역(바이옴) ============ */
const BIOMES=[
  {id:"grass", name:"풀숲",  emoji:"🌿", g1:"#7ec86b",g2:"#72c05f",road:"#3a3d4d",edge:"#f4f4f8",dash:"#ffd23f",decor:"tree"},
  {id:"desert",name:"사막",  emoji:"🏜️", g1:"#e8cf8f",g2:"#e0c47e",road:"#6b5a44",edge:"#fff4dc",dash:"#fff0b0",decor:"cactus"},
  {id:"ice",   name:"빙하",  emoji:"❄️", g1:"#d6eefc",g2:"#c2e4f7",road:"#5c6b78",edge:"#ffffff",dash:"#bfe6ff",decor:"ice"},
  {id:"city",  name:"도시",  emoji:"🏙️", g1:"#8a8f9c",g2:"#7e838f",road:"#2f3140",edge:"#ffd23f",dash:"#ffffff",decor:"building"},
  {id:"jungle",name:"정글",  emoji:"🌴", g1:"#3f8a4a",g2:"#377d42",road:"#33403a",edge:"#e8ffe0",dash:"#ffe27a",decor:"palm"},
  {id:"hanok", name:"한옥마을",emoji:"🏯",g1:"#c29b6e",g2:"#b78f60",road:"#4a3d33",edge:"#f5e6c8",dash:"#ffd27a",decor:"hanok"},
];
const BIOME_DIST=300;

/* ============ 캔버스 ============ */
const cv=document.getElementById("c"), ctx=cv.getContext("2d");
const stage=document.getElementById("stage");
let W=400,H=640,DPR=1,ROAD_X0,ROAD_X1,ROAD_W;
function resize(){
  // 모든 기기에서 동일한 화면 비율(가로:세로 = 460:840)로 고정
  const RATIO=840/460;
  let sw=Math.min(window.innerWidth,460);
  let sh=sw*RATIO;
  if(sh>window.innerHeight){ sh=window.innerHeight; sw=sh/RATIO; }
  stage.style.width=sw+"px"; stage.style.height=sh+"px";
  W=sw; H=sh;
  DPR=Math.min(2.5,window.devicePixelRatio||1);
  cv.width=W*DPR; cv.height=H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0);
  const m=Math.max(26,W*0.10); ROAD_X0=m; ROAD_X1=W-m; ROAD_W=ROAD_X1-ROAD_X0;
}
window.addEventListener("resize",resize);

/* ============ 상태 ============ */
let state="start";
let player,things,decor,scrollY,speed,dist,coins,boost,boosting,boostT,skids,particles,lastRowY,lastDecorY,difficulty,spawnGapExtra,biomeIdx,prevIdx,transT;
let shakeT=0,shakeDur=1,shakeMag=0;
let animT=0, trail=[], trailHue=0;
let boostMul=1, graceT=0, floats=[], nextChestDist=180, chestPending=false, duckHearts=[];
const KART_W=34,KART_H=48,BASE_SPEED=280,MAX_SPEED=820;
function addShake(mag,dur){shakeMag=mag;shakeDur=dur;shakeT=dur;}

function reset(){
  player={x:(ROAD_X0+ROAD_X1)/2,tx:(ROAD_X0+ROAD_X1)/2,tilt:0};
  things=[];decor=[];scrollY=0;speed=BASE_SPEED;dist=0;coins=0;
  boost=0;boosting=false;boostT=0;skids=[];particles=[];
  lastRowY=-120;lastDecorY=0;difficulty=0;spawnGapExtra=40;
  biomeIdx=0;prevIdx=0;transT=1;trail=[];trailHue=0;boostMul=1;graceT=0;floats=[];nextChestDist=180;chestPending=false;duckHearts=[];
}

/* ============ 입력 ============ */
function setTarget(clientX){const r=cv.getBoundingClientRect();let x=clientX-r.left;
  player.tx=Math.max(ROAD_X0+KART_W/2,Math.min(ROAD_X1-KART_W/2,x));}
cv.addEventListener("touchstart",e=>{if(state==="play")setTarget(e.touches[0].clientX);},{passive:true});
cv.addEventListener("touchmove",e=>{if(state==="play")setTarget(e.touches[0].clientX);},{passive:true});
let mouseDown=false;
cv.addEventListener("mousedown",e=>{mouseDown=true;if(state==="play")setTarget(e.clientX);});
window.addEventListener("mouseup",()=>mouseDown=false);
cv.addEventListener("mousemove",e=>{if(state==="play"&&mouseDown)setTarget(e.clientX);});
const keys={};
window.addEventListener("keydown",e=>{keys[e.key]=true;
  if(e.key===" "){e.preventDefault();if(state==="play")useBoost();}
  if(e.key==="Enter"&&(state==="start"||state==="over"))startGame();});
window.addEventListener("keyup",e=>keys[e.key]=false);

/* ============ 부스터 ============ */
function useBoost(){if(state!=="play"||boost<100||boosting)return;boosting=true;boostT=4.0;boost=0;addShake(9,.35);sfx("boost");updateBoostBtn();}
function updateBoostBtn(){const b=document.getElementById("boostBtn");
  document.getElementById("boostFill").style.width=Math.min(100,boost)+"%";
  const ready=boost>=100&&!boosting;b.disabled=!ready;b.classList.toggle("ready",ready);}

/* ============ 생성 ============ */
function spawnRow(){
  const gapW=Math.max(KART_W*2.0,ROAD_W*0.34)+spawnGapExtra;
  const gapC=ROAD_X0+gapW/2+Math.random()*(ROAD_W-gapW);
  const block=44,y=-40;
  for(let x=ROAD_X0;x<ROAD_X1-6;x+=block){const cx=x+block/2;
    if(cx>gapC-gapW/2-block*0.4&&cx<gapC+gapW/2+block*0.4)continue;
    things.push({t:"ob",x:x+block/2,y,w:block-6,h:38,biome:BIOMES[biomeIdx].id,variant:Math.random()<0.5?0:1});}
  if(chestPending){ things.push({t:"chest",x:gapC,y:y-2,w:34,h:26}); chestPending=false; } // 빈틈(통과 경로)에 보물상자
  else if(Math.random()<0.8){const n=2+Math.floor(Math.random()*3);
    for(let i=0;i<n;i++)things.push({t:"coin",x:gapC+(Math.random()-0.5)*gapW*0.5,y:y-28*i,r:11});}
  if(Math.random()<0.28)things.push({t:"boost",x:gapC+(Math.random()-0.5)*gapW*0.4,y:y-90,r:15});
}
function spawnChest(){const x=ROAD_X0+20+Math.random()*(ROAD_W-40);things.push({t:"chest",x,y:-42,w:34,h:26});}
function spawnDecor(){const side=Math.random()<0.5?0:1;
  const x= side? ROAD_X1+ (W-ROAD_X1)*(0.2+Math.random()*0.6) : ROAD_X0*(0.2+Math.random()*0.6);
  decor.push({x,y:-40,kind:BIOMES[biomeIdx].decor,s:0.8+Math.random()*0.5});}

/* ============ 업데이트 ============ */
function update(dt){
  if(keys["ArrowLeft"]||keys["a"])player.tx-=520*dt;
  if(keys["ArrowRight"]||keys["d"])player.tx+=520*dt;
  player.tx=Math.max(ROAD_X0+KART_W/2,Math.min(ROAD_X1-KART_W/2,player.tx));

  difficulty+=dt;
  spawnGapExtra=Math.max(0,40-difficulty*1.2);
  let targetSpeed=Math.min(MAX_SPEED,BASE_SPEED+dist*0.18);
  speed+=(targetSpeed-speed)*Math.min(1,dt*2);
  const bm=boosting?1.9:1; boostMul+=(bm-boostMul)*Math.min(1,dt*6); // 부스터 끝나도 속도 스르륵
  let curSpeed=speed*boostMul;
  if(boosting){boostT-=dt;if(boostT<=0){boosting=false;graceT=2.5;}} // 끝나면 2.5초 무적 유예
  if(graceT>0)graceT-=dt;

  const dx=player.tx-player.x;
  player.x+=dx*Math.min(1,dt*12);
  player.tilt+=((dx*0.02)-player.tilt)*Math.min(1,dt*10);
  player.tilt=Math.max(-0.4,Math.min(0.4,player.tilt));
  if(Math.abs(dx)>26&&!boosting){skids.push({x:player.x-10,y:H*0.78+14,a:0.5},{x:player.x+10,y:H*0.78+14,a:0.5});
    boost=Math.min(100,boost+4*dt);}

  scrollY+=curSpeed*dt; dist+=curSpeed*dt/26;
  lastRowY+=curSpeed*dt; lastDecorY+=curSpeed*dt;
  if(lastRowY>=168){lastRowY=0;spawnRow();}
  if(lastDecorY>=105){lastDecorY=0;spawnDecor();}
  if(dist>=nextChestDist){nextChestDist=dist+150+Math.random()*150;chestPending=true;} // 월드당 1~2개, 다음 줄 빈틈에 배치

  // 바이옴 전환
  const bi=Math.floor(dist/BIOME_DIST)%BIOMES.length;
  if(bi!==biomeIdx){prevIdx=biomeIdx;biomeIdx=bi;transT=0;showBanner(BIOMES[bi]);}
  if(transT<1)transT=Math.min(1,transT+dt/0.8);

  const py=H*0.78,phw=KART_W/2-3,phh=KART_H/2-4;
  for(const o of things){o.y+=curSpeed*dt;
    if(o.t==="ob"){if(!boosting&&graceT<=0&&Math.abs(o.x-player.x)<o.w/2+phw&&Math.abs(o.y-py)<o.h/2+phh){crash();return;}}
    else if(o.t==="coin"&&!o.got){if(Math.abs(o.x-player.x)<o.r+phw&&Math.abs(o.y-py)<o.r+phh){o.got=true;coins++;sparkle(o.x,o.y,"#ffd23f");sfx("coin");}}
    else if(o.t==="boost"&&!o.got){if(Math.abs(o.x-player.x)<o.r+phw&&Math.abs(o.y-py)<o.r+phh){o.got=true;boost=Math.min(100,boost+12.5);sparkle(o.x,o.y,"#ff8c1a");sfx("power");}}
    else if(o.t==="chest"&&!o.got){if(Math.abs(o.x-player.x)<o.w/2+phw&&Math.abs(o.y-py)<o.h/2+phh){o.got=true;const n=8+Math.floor(Math.random()*5);coins+=n;floats.push({x:o.x,y:o.y,t:"+"+n,life:1});sparkle(o.x,o.y,"#ffd23f");sfx("chest");}}}
  things=things.filter(o=>o.y<H+60&&!o.got);
  for(const d of decor)d.y+=curSpeed*dt;
  decor=decor.filter(d=>d.y<H+80);
  skids=skids.filter(s=>{s.y+=curSpeed*dt;s.a-=dt*0.8;return s.a>0&&s.y<H+20;});
  particles=particles.filter(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=0.3;p.life-=dt*2;return p.life>0;});
  floats=floats.filter(f=>{f.y-=42*dt;f.life-=dt*0.85;return f.life>0;});

  // 특수 스킨 트레일(무지개/황금)
  const psk=SKIN(SAVE.skin);
  if(psk.id==="rainbow"){ trailHue=(trailHue+16)%360; trail.push({x:player.x,y:H*0.78+KART_H*0.42,hue:trailHue,life:1}); }
  else if(psk.id==="gold"){ if(Math.random()<0.85) trail.push({x:player.x+(Math.random()-0.5)*KART_W,y:H*0.78+KART_H*0.35+Math.random()*6,life:1,gold:true}); }
  else if(psk.id==="carbon"){ trail.push({x:player.x-7,y:H*0.78+KART_H*0.46,life:1,laser:true},{x:player.x+7,y:H*0.78+KART_H*0.46,life:1,laser:true}); }
  else if(psk.id==="flame"){ for(let i=0;i<3;i++)trail.push({x:player.x+(Math.random()-0.5)*KART_W*0.75,y:H*0.78+KART_H*0.45+Math.random()*8,life:1,fire:true,c:["#ff2b1f","#ff7a2e","#ffd23f"][i%3],s:6+Math.random()*9}); }
  // 지역 차종: 소소한 특수효과
  else if(psk.id==="tractor"){ if(Math.random()<0.5)trail.push({x:player.x+(Math.random()-0.5)*KART_W,y:H*0.78+KART_H*0.42,life:1,puff:true,c:"#b98a4a",s:5+Math.random()*5}); }
  else if(psk.id==="jeep"){ if(Math.random()<0.6)trail.push({x:player.x+(Math.random()-0.5)*KART_W,y:H*0.78+KART_H*0.42,life:1,puff:true,c:"#e6cf8f",s:5+Math.random()*6}); }
  else if(psk.id==="snow"){ if(Math.random()<0.55)trail.push({x:player.x+(Math.random()-0.5)*KART_W,y:H*0.78+KART_H*0.4,life:1,flake:true,s:4+Math.random()*4}); }
  else if(psk.id==="super"){ if(Math.random()<0.65)trail.push({x:player.x+(Math.random()-0.5)*KART_W*0.7,y:H*0.78+KART_H*0.44,life:1,spark:true,c:Math.random()<0.5?"#00e5ff":"#ffd23f"}); }
  else if(psk.id==="dump"){ if(Math.random()<0.5)trail.push({x:player.x+(Math.random()-0.5)*KART_W,y:H*0.78+KART_H*0.4,life:1,leaf:true,c:Math.random()<0.5?"#3f9e5a":"#5fbf6a",s:5+Math.random()*4,rot:Math.random()*6}); }
  else if(psk.id==="hanok"){ if(Math.random()<0.45)trail.push({x:player.x+(Math.random()-0.5)*KART_W*1.2,y:H*0.78+KART_H*0.3,life:1,petal:true,c:"#ffc0d8",s:5+Math.random()*4,rot:Math.random()*6}); }
  for(const tr of trail){ tr.y+=curSpeed*dt; tr.life-=dt*(tr.laser?2.4:tr.fire?2.6:tr.gold?1.7:1.15); }
  // 사랑에 빠진 오리: 하트 뿅뿅
  if(psk.id==="duck"){ if(Math.random()<0.55) duckHearts.push({x:player.x+(Math.random()-0.5)*KART_W*1.6,y:H*0.78+(Math.random()-0.5)*KART_H*0.5,vy:-45-Math.random()*45,vx:(Math.random()-0.5)*35,life:1,sz:9+Math.random()*9}); }
  else if(psk.id==="potato"){ if(Math.random()<0.5) duckHearts.push({x:player.x+(Math.random()-0.5)*KART_W*1.1,y:H*0.78-KART_H*0.26,vy:20+Math.random()*40,vx:(Math.random()-0.5)*30,life:1,sz:6+Math.random()*5,tear:true}); }
  for(const h of duckHearts){h.y+=h.vy*dt;h.x+=h.vx*dt;h.life-=dt*0.9;}
  duckHearts=duckHearts.filter(h=>h.life>0);
  trail=trail.filter(tr=>tr.life>0 && tr.y<H+30);

  document.getElementById("dist").textContent=Math.floor(dist);
  document.getElementById("coins").textContent=coins;
  document.getElementById("spd").textContent=Math.round(curSpeed/5);
  updateBoostBtn();
}
function sparkle(x,y,c){for(let i=0;i<8;i++)particles.push({x,y,vx:(Math.random()-.5)*5,vy:-Math.random()*4-1,life:1,c});}

function crash(){
  for(let i=0;i<24;i++)particles.push({x:player.x,y:H*0.78,vx:(Math.random()-.5)*9,vy:-Math.random()*8-2,life:1.3,c:["#ff6b9d","#ffd23f","#6bd3ff"][i%3]});
  sfx("crash");
  finishRun(false);
}
function quitRun(){ if(state!=="play")return; finishRun(true); }
function finishRun(voluntary){
  state="over";
  addShake(voluntary?5:16, voluntary?0.35:3.0); // 죽을때 흔들림 정확히 3초
  const score=Math.floor(dist)+coins*10;
  SAVE.coins+=coins;
  const isBest=score>(SAVE.best||0);
  if(isBest)SAVE.best=score;
  // 지역 완주 스킨 해금
  const newly=[];
  for(const sc of SKINS){ if(sc.unlock && !SAVE.owned.includes(sc.id) && Math.floor(dist)>=sc.unlock.dist){ SAVE.owned.push(sc.id); newly.push(sc); } }
  save();
  const um=document.getElementById("unlockMsg");
  if(newly.length){ um.style.display="block"; sfx("unlock");
    um.innerHTML="🎉 새 스킨 해금!<br>"+newly.map(s=>"🚗 <b>"+s.name+"</b>").join("<br>")+"<br><span style='font-size:12px;opacity:.9'>상점에서 장착할 수 있어!</span>"; }
  else um.style.display="none";
  cloudSaveProfile(); // 코인·해금 서버 저장
  document.getElementById("finalDist").textContent=Math.floor(dist);
  document.getElementById("finalCoins").textContent=coins;
  document.getElementById("finalScore").textContent=score;
  document.getElementById("overBest").innerHTML=isBest?"🎉 개인 신기록!":"🏆 내 최고: "+(SAVE.best||0)+"점";
  document.getElementById("overEmoji").textContent=isBest?"🏆":(voluntary?"🏁":"💥");
  document.getElementById("overTitle").textContent=isBest?"신기록!":(voluntary?"기록 완료!":"크래시!");
  document.getElementById("overMsg").innerHTML=voluntary?"기록 저장했어! 다시 달려볼까? 🏎️":(score<300?"방금은 몸풀기지? 다시 ㄱㄱ":score<900?"제법 잘 달리는데? 🏎️":"카트라이더 각 나오는데?! 🔥");
  document.getElementById("boostBtn").style.display="none";
  document.getElementById("quitBtn").style.display="none";
  document.getElementById("overRank").innerHTML="";
  setTimeout(()=>document.getElementById("over").style.display="flex",voluntary?60:280);
  submitScore(score);
}

/* ============ 배너 ============ */
let bannerT=null;
function showBanner(b){const el=document.getElementById("biomeBanner");
  el.textContent=b.emoji+" "+b.name+" 지역!";el.classList.add("show");
  clearTimeout(bannerT);bannerT=setTimeout(()=>el.classList.remove("show"),1800);}

/* ============ 색 보간 ============ */
function hx(h){h=h.replace("#","");return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];}
function mix(a,b,t){const A=hx(a),B=hx(b);return "rgb("+Math.round(A[0]+(B[0]-A[0])*t)+","+Math.round(A[1]+(B[1]-A[1])*t)+","+Math.round(A[2]+(B[2]-A[2])*t)+")";}
function curBiomeColors(){const c=BIOMES[biomeIdx],p=BIOMES[prevIdx],t=transT;
  return {g1:mix(p.g1,c.g1,t),g2:mix(p.g2,c.g2,t),road:mix(p.road,c.road,t),edge:mix(p.edge,c.edge,t),dash:mix(p.dash,c.dash,t)};}

/* ============ 그리기 ============ */
function frame(ts){const dt=Math.min(0.033,(ts-last)/1000||0);last=ts;
  animT+=dt;
  if(shakeT>0)shakeT=Math.max(0,shakeT-dt);
  if(state==="play")update(dt);
  draw();requestAnimationFrame(frame);}
let last=0;

function draw(){
  const s=shakeT>0?shakeMag*(shakeT/shakeDur):0;
  ctx.save();ctx.translate((Math.random()-0.5)*s,(Math.random()-0.5)*s);
  const B=curBiomeColors();
  ctx.fillStyle=B.g1;ctx.fillRect(-20,0,W+40,H);
  ctx.fillStyle=B.g2;const sh2=60,off=scrollY%(sh2*2);
  for(let y=-sh2*2+off;y<H;y+=sh2*2)ctx.fillRect(-20,y,W+40,sh2);
  // 갓길 장식
  for(const d of decor)drawDecor(d);
  // 도로
  ctx.fillStyle=B.road;ctx.fillRect(ROAD_X0,0,ROAD_W,H);
  ctx.fillStyle=B.edge;ctx.fillRect(ROAD_X0-3,0,5,H);ctx.fillRect(ROAD_X1-2,0,5,H);
  ctx.fillStyle=B.dash;const dash=34,dgap=28,doff=scrollY%(dash+dgap);
  for(let y=-dash+doff;y<H;y+=dash+dgap)ctx.fillRect(W/2-3,y,6,dash);
  for(const sk of skids){ctx.globalAlpha=Math.max(0,sk.a)*0.5;ctx.fillStyle="#111";ctx.fillRect(sk.x-2,sk.y,4,10);}
  ctx.globalAlpha=1;
  // 물체
  for(const o of things){
    if(o.t==="ob"){ drawObstacle(o);
    }else if(o.t==="coin"){ctx.fillStyle="#ffd23f";ctx.beginPath();ctx.arc(o.x,o.y,o.r,0,7);ctx.fill();
      ctx.strokeStyle="#e0a800";ctx.lineWidth=2;ctx.stroke();
      ctx.fillStyle="#e0a800";ctx.font="bold 13px Jua,sans-serif";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText("₩",o.x,o.y+1);}
    else if(o.t==="boost"){ctx.fillStyle="#ff8c1a";ctx.beginPath();ctx.arc(o.x,o.y,o.r,0,7);ctx.fill();
      ctx.fillStyle="#fff";ctx.font="16px sans-serif";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText("🚀",o.x,o.y+1);}
    else if(o.t==="chest"){const x=o.x,y=o.y,w=o.w,h=o.h;
      ctx.fillStyle="#8a5a2e";rr(x-w/2,y-h/2+6,w,h-6,3);ctx.fill(); // 상자 몸통
      ctx.fillStyle="#a06a38";rr(x-w/2,y-h/2,w,10,3);ctx.fill();   // 뚜껑
      ctx.fillStyle="#ffd23f";ctx.fillRect(x-w/2,y-h/2+9,w,3);      // 금테
      ctx.fillStyle="#ffd23f";rr(x-4,y-2,8,9,2);ctx.fill();ctx.fillStyle="#7a5a00";ctx.fillRect(x-1,y+1,2,3); // 자물쇠
    }
  }
  for(const f of floats){ctx.globalAlpha=Math.max(0,f.life);ctx.fillStyle="#ffd23f";ctx.font="bold 22px 'Jua',sans-serif";
    ctx.textAlign="center";ctx.textBaseline="middle";ctx.strokeStyle="#6b4e00";ctx.lineWidth=3;ctx.strokeText(f.t,f.x,f.y);ctx.fillText(f.t,f.x,f.y);}
  ctx.globalAlpha=1;
  for(const p of particles){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.fillRect(p.x-3,p.y-3,6,6);}
  ctx.globalAlpha=1;
  if(boosting){ctx.strokeStyle="rgba(255,255,255,.5)";ctx.lineWidth=3;
    for(let i=0;i<10;i++){const x=ROAD_X0+Math.random()*ROAD_W,y=(scrollY*3+i*90)%H;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x,y+40);ctx.stroke();}}
  // 특수 스킨 트레일 렌더 (카트 뒤)
  for(const tr of trail){
    if(tr.laser){const a=Math.max(0,tr.life);ctx.globalAlpha=a*0.45;ctx.strokeStyle="#ff6a8a";ctx.lineWidth=7;ctx.lineCap="round";ctx.beginPath();ctx.moveTo(tr.x,tr.y);ctx.lineTo(tr.x,tr.y+22);ctx.stroke();
      ctx.globalAlpha=a;ctx.strokeStyle="#ff2b4d";ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(tr.x,tr.y);ctx.lineTo(tr.x,tr.y+22);ctx.stroke();
      ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(tr.x,tr.y,2.2,0,7);ctx.fill();}
    else if(tr.fire){ctx.globalAlpha=Math.max(0,tr.life)*0.9;ctx.fillStyle=tr.c;ctx.beginPath();ctx.arc(tr.x,tr.y,tr.s*tr.life,0,7);ctx.fill();}
    else if(tr.gold){ctx.globalAlpha=Math.max(0,tr.life);const s=3+tr.life*4;ctx.fillStyle="#ffe27a";ctx.fillRect(tr.x-s/2,tr.y-s/2,s,s);ctx.fillStyle="#fff7cf";ctx.fillRect(tr.x-1,tr.y-1,2,2);}
    else if(tr.puff){ctx.globalAlpha=Math.max(0,tr.life)*0.55;ctx.fillStyle=tr.c;ctx.beginPath();ctx.arc(tr.x,tr.y,tr.s*(0.6+tr.life*0.7),0,7);ctx.fill();}
    else if(tr.flake){ctx.globalAlpha=Math.max(0,tr.life);drawSparkle(tr.x,tr.y,tr.s,"#eaf7ff");}
    else if(tr.spark){ctx.globalAlpha=Math.max(0,tr.life);ctx.fillStyle=tr.c;ctx.fillRect(tr.x-1,tr.y-3,2,6);}
    else if(tr.leaf||tr.petal){ctx.globalAlpha=Math.max(0,tr.life);ctx.fillStyle=tr.c;ctx.save();ctx.translate(tr.x,tr.y);ctx.rotate((tr.rot||0)+animT*3);ctx.beginPath();ctx.ellipse(0,0,tr.s*0.5,tr.s,0,0,7);ctx.fill();ctx.restore();}
    else if('hue' in tr){ctx.globalAlpha=Math.max(0,tr.life)*0.85;ctx.fillStyle="hsl("+tr.hue+",92%,58%)";ctx.beginPath();ctx.arc(tr.x,tr.y,KART_W*0.45*tr.life+3,0,7);ctx.fill();}
  }
  ctx.globalAlpha=1;
  if(player)drawKart(ctx,player.x,H*0.78,player.tilt,SKIN(SAVE.skin));
  // 딸기우유 블링블링(차 주변 맴도는 반짝이)
  if(player&&state==="play"&&SAVE.skin==="berry"){ const px=player.x,py=H*0.78;
    for(let i=0;i<5;i++){ const ang=animT*2.3+i*(Math.PI*2/5); const sx=px+Math.cos(ang)*KART_W*0.85, sy=py+Math.sin(ang)*KART_H*0.6;
      const tw=0.55+0.45*Math.sin(animT*7+i*1.7); ctx.globalAlpha=Math.max(0,tw); drawSparkle(sx,sy,3+tw*2.5, i%2?"#ffffff":"#ffd0e4"); }
    ctx.globalAlpha=1; }
  // 사랑에 빠진 오리: 하트 뿅뿅
  if(player&&state==="play"&&(SAVE.skin==="duck"||SAVE.skin==="potato")){ for(const h of duckHearts){ ctx.globalAlpha=Math.max(0,h.life);
      if(h.tear){ctx.fillStyle="#7ac8ff";ctx.beginPath();ctx.ellipse(h.x,h.y,h.sz*0.55,h.sz,0,0,7);ctx.fill();}
      else drawHeartG(ctx,h.x,h.y,h.sz*(0.6+h.life*0.5), h.life>0.5?"#ff5a8a":"#ff9ec2"); } ctx.globalAlpha=1; }
  ctx.restore();
}

function drawDecor(d){const g=ctx,x=d.x,y=d.y,s=d.s;g.save();g.translate(x,y);g.scale(s,s);
  if(d.kind==="tree"){g.fillStyle="#6b4a2e";g.fillRect(-4,4,8,16);g.fillStyle="#3e8e3e";g.beginPath();g.arc(0,-4,16,0,7);g.fill();g.fillStyle="#4aa64a";g.beginPath();g.arc(-6,-8,10,0,7);g.fill();}
  else if(d.kind==="cactus"){g.fillStyle="#3f9e5a";rrG(g,-6,-18,12,34,6);g.fill();rrG(g,-16,-6,10,8,4);g.fill();rrG(g,-16,-14,6,16,3);g.fill();rrG(g,6,-2,10,7,4);g.fill();rrG(g,10,-12,6,14,3);g.fill();}
  else if(d.kind==="ice"){g.fillStyle="#eaf7ff";g.beginPath();g.moveTo(0,-20);g.lineTo(14,10);g.lineTo(-14,10);g.closePath();g.fill();g.fillStyle="#c7e8fb";g.beginPath();g.moveTo(0,-20);g.lineTo(0,10);g.lineTo(-14,10);g.closePath();g.fill();}
  else if(d.kind==="building"){g.fillStyle="#5a5f6e";rrG(g,-14,-40,28,58,3);g.fill();g.fillStyle="#ffe27a";for(let a=-9;a<=6;a+=8)for(let b=-34;b<10;b+=11)g.fillRect(a,b,5,6);}
  else if(d.kind==="palm"){g.fillStyle="#7a5230";g.fillRect(-3,0,6,20);g.fillStyle="#2f8f45";for(const ang of[-1,-0.4,0.4,1]){g.save();g.rotate(ang);g.beginPath();g.ellipse(0,-8,5,16,0,0,7);g.fill();g.restore();}}
  else if(d.kind==="hanok"){g.fillStyle="#8a5a3c";g.fillRect(-14,0,28,14);g.fillStyle="#3a4a5a";g.beginPath();g.moveTo(-20,0);g.quadraticCurveTo(0,-18,20,0);g.lineTo(14,2);g.quadraticCurveTo(0,-10,-14,2);g.closePath();g.fill();}
  g.restore();}

function drawObstacle(o){
  const g=ctx,w=o.w,h=o.h,v=o.variant;g.save();g.translate(o.x,o.y);
  const B=o.biome;
  if(B==="grass"){
    if(v===0){g.fillStyle="#8f949d";g.beginPath();g.moveTo(-w/2,h/2);g.lineTo(-w/2+3,-h/5);g.lineTo(-3,-h/2);g.lineTo(w/2-2,-h/6);g.lineTo(w/2,h/2);g.closePath();g.fill();
      g.fillStyle="#a9aeb7";g.beginPath();g.moveTo(-3,-h/2);g.lineTo(w/2-2,-h/6);g.lineTo(0,2);g.closePath();g.fill();}
    else{g.fillStyle="#8a5a34";rrG(g,-w/2,-h*0.32,w,h*0.64,7);g.fill();g.fillStyle="#caa06a";g.beginPath();g.arc(w/2-4,0,h*0.3,0,7);g.fill();
      g.strokeStyle="#8a5a34";g.lineWidth=2;g.beginPath();g.arc(w/2-4,0,h*0.15,0,7);g.stroke();}
  }else if(B==="desert"){
    if(v===0){g.fillStyle="#3f9e5a";rrG(g,-6,-h/2,12,h,6);g.fill();rrG(g,-16,-4,10,8,4);g.fill();rrG(g,-16,-14,6,14,3);g.fill();rrG(g,6,-2,10,7,4);g.fill();rrG(g,10,-12,6,12,3);g.fill();}
    else{g.strokeStyle="#8bbf3f";g.lineWidth=8;g.lineCap="round";g.beginPath();g.moveTo(-w/2+4,h/4);g.quadraticCurveTo(0,-h/2,w/2-6,h/6);g.stroke();
      g.fillStyle="#8bbf3f";g.beginPath();g.arc(w/2-6,h/6,6,0,7);g.fill();g.fillStyle="#222";g.fillRect(w/2-9,h/6-3,2,2);
      g.strokeStyle="#e0483f";g.lineWidth=1.5;g.beginPath();g.moveTo(w/2,h/6);g.lineTo(w/2+4,h/6);g.stroke();}
  }else if(B==="ice"){
    if(v===0){g.fillStyle="#bfe6fb";rrG(g,-w/2,-h/2,w,h,6);g.fill();g.fillStyle="#e6f6ff";g.beginPath();g.moveTo(-w/2,-h/2);g.lineTo(w/2,-h/2);g.lineTo(w/4,-2);g.lineTo(-w/2,0);g.closePath();g.fill();
      g.strokeStyle="#8fd0ee";g.lineWidth=1.5;g.beginPath();g.moveTo(0,-h/2);g.lineTo(-4,4);g.moveTo(w/4,-2);g.lineTo(4,h/2);g.stroke();}
    else{g.fillStyle="#fff";g.beginPath();g.arc(0,h*0.18,h*0.28,0,7);g.fill();g.beginPath();g.arc(0,-h*0.16,h*0.2,0,7);g.fill();
      g.fillStyle="#333";g.fillRect(-4,-h*0.2,2,2);g.fillRect(3,-h*0.2,2,2);g.fillStyle="#ff8c1a";g.beginPath();g.moveTo(0,-h*0.14);g.lineTo(6,-h*0.11);g.lineTo(0,-h*0.08);g.closePath();g.fill();
      g.strokeStyle="#e0483f";g.lineWidth=3;g.beginPath();g.moveTo(-h*0.18,0);g.lineTo(h*0.18,0);g.stroke();}
  }else if(B==="city"){
    if(v===0){g.fillStyle="#ff7a2e";g.beginPath();g.moveTo(0,-h/2);g.lineTo(w*0.32,h/2-4);g.lineTo(-w*0.32,h/2-4);g.closePath();g.fill();
      g.fillStyle="#fff";g.fillRect(-w*0.2,-2,w*0.4,6);g.fillStyle="#e05f14";g.fillRect(-w/2,h/2-5,w,5);}
    else{g.fillStyle="#c9ccd2";g.fillRect(-2,-2,4,h/2);g.fillStyle="#e0322f";g.beginPath();g.arc(0,-h*0.12,h*0.32,0,7);g.fill();
      g.fillStyle="#fff";g.fillRect(-h*0.22,-h*0.12-3,h*0.44,6);}
  }else if(B==="jungle"){
    if(v===0){g.fillStyle="#7a5230";rrG(g,-w/2,-h*0.28,w,h*0.56,7);g.fill();g.fillStyle="#3f9e5a";rrG(g,-w/2,-h*0.36,w,8,4);g.fill();
      g.fillStyle="#caa06a";g.beginPath();g.arc(w/2-4,0,h*0.24,0,7);g.fill();}
    else{g.fillStyle="#2f8f45";g.beginPath();g.arc(0,4,h*0.34,0,7);g.fill();g.beginPath();g.arc(-8,-2,h*0.2,0,7);g.fill();g.beginPath();g.arc(9,-1,h*0.2,0,7);g.fill();

function drawKart(g,x,y,tilt,sk){g.save();g.translate(x,y);g.rotate(tilt);

    g.fillStyle="#6e5a2e";rrG(g,W2-10,H2-15,6,8,1);g.fill();g.strokeStyle="rgba(0,0,0,.3)";g.lineWidth=1;g.stroke();
    // 모래 먼지
    g.fillStyle="rgba(238,213,152,.6)";[[W2*0.42,H2*0.35,3.2],[-W2*0.42,4,2.6],[8,-H2*0.3,2.2],[-5,H2*0.5,2],[W2*0.18,-7,1.8]].forEach(d=>{g.beginPath();g.arc(d[0],d[1],d[2],0,7);g.fill();});
  }else if(sk.id==="snow"){ // 빙하: 쌓인 눈+고드름+눈송이 데칼
    // 지붕에 울퉁불퉁 쌓인 눈
    g.fillStyle="#ffffff";g.beginPath();g.moveTo(-W2*0.62,-H2+9);
    g.quadraticCurveTo(-W2*0.3,-H2+3,0,-H2+7);g.quadraticCurveTo(W2*0.3,-H2+2,W2*0.62,-H2+9);
    g.quadraticCurveTo(0,-H2+12,-W2*0.62,-H2+9);g.closePath();g.fill();
    // 앞범퍼 고드름
    g.fillStyle="#eaf7ff";for(const ix of [-9,-3,4]){g.beginPath();g.moveTo(ix,-H2+2);g.lineTo(ix+2.4,-H2+2);g.lineTo(ix+1.2,-H2+7);g.closePath();g.fill();}
    // 후드 눈송이 데칼
    g.strokeStyle="rgba(140,195,235,.85)";g.lineWidth=1;const cx0=0,cy0=8;
    for(let a=0;a<6;a++){const an=a*Math.PI/3;g.beginPath();g.moveTo(cx0,cy0);g.lineTo(cx0+Math.cos(an)*4.5,cy0+Math.sin(an)*4.5);g.stroke();}
    // 서리 반짝
    g.fillStyle="rgba(205,238,255,.95)";[[-7,-2,1.6],[8,2,1.6],[4,13,1.6],[-9,14,1.3]].forEach(d=>{g.beginPath();g.arc(d[0],d[1],d[2],0,7);g.fill();});
  }else if(sk.id==="super"){ // 도시: 네온 언더글로우 + 레이싱 스트라이프
    g.strokeStyle="rgba(0,225,255,.8)";g.lineWidth=2;g.beginPath();g.moveTo(-W2+2,H2-5);g.lineTo(W2-2,H2-5);g.stroke();
    g.fillStyle="rgba(255,255,255,.85)";g.fillRect(-5,-H2,3,11);g.fillRect(2,-H2,3,11);
  }else if(sk.id==="dump"){ // 정글: 잎/덩굴 + 진흙
    g.fillStyle="#2f8f45";g.beginPath();g.ellipse(-W2*0.32,-H2*0.18,4,7,-0.6,0,7);g.fill();g.beginPath();g.ellipse(W2*0.3,H2*0.12,4,6,0.6,0,7);g.fill();
    g.fillStyle="rgba(70,50,25,.5)";g.beginPath();g.arc(2,H2*0.32,3,0,7);g.fill();g.beginPath();g.arc(-W2*0.35,H2*0.4,2.4,0,7);g.fill();
  }else if(sk.id==="hanok"){ // 한옥: 단청 포인트(처마 라인)
    g.strokeStyle="#e0483f";g.lineWidth=1.5;g.beginPath();g.moveTo(-W2+7,0.5);g.lineTo(W2-7,0.5);g.stroke();
    g.strokeStyle="#2f9aa0";g.beginPath();g.moveTo(-W2+7,10.5);g.lineTo(W2-7,10.5);g.stroke();
  }

  // ===== 부스터(무적) 중: 깜빡 + 무지개 일렁임 =====
  if(boosting){
    const blink=0.3+0.4*Math.sin(animT*26);      // 깜빡깜빡
    const hue=(animT*280)%360;
    g.save();g.globalCompositeOperation="lighter";
    g.globalAlpha=Math.max(0,blink);g.fillStyle="hsl("+hue+",95%,60%)";
    g.beginPath();g.ellipse(0,0,W2+4,H2+2,0,0,7);g.fill();
    g.globalAlpha=Math.max(0,blink)+0.25;g.lineWidth=3;g.strokeStyle="hsl("+((hue+140)%360)+",95%,66%)";
    g.beginPath();g.ellipse(0,0,W2+6,H2+4,0,0,7);g.stroke();
    g.restore();
  } else if(graceT>0){ // 무적 유예: 하얗게 깜빡
    const bl=0.5+0.5*Math.sin(animT*30);
    g.save();g.globalAlpha=bl*0.55;g.fillStyle="#ffffff";g.beginPath();g.ellipse(0,0,W2+2,H2,0,0,7);g.fill();g.restore();
  }
  g.restore();}

function drawSparkle(x,y,r,c){ctx.fillStyle=c;ctx.beginPath();ctx.moveTo(x,y-r);ctx.lineTo(x+r*0.32,y-r*0.32);ctx.lineTo(x+r,y);ctx.lineTo(x+r*0.32,y+r*0.32);ctx.lineTo(x,y+r);ctx.lineTo(x-r*0.32,y+r*0.32);ctx.lineTo(x-r,y);ctx.lineTo(x-r*0.32,y-r*0.32);ctx.closePath();ctx.fill();}
function drawHeartG(g,x,y,s,c){const t=s/16;g.fillStyle=c;g.beginPath();g.moveTo(x,y+5*t);g.bezierCurveTo(x,y+1*t,x-8*t,y-2*t,x-8*t,y-6*t);g.bezierCurveTo(x-8*t,y-11*t,x-2*t,y-11*t,x,y-6*t);g.bezierCurveTo(x+2*t,y-11*t,x+8*t,y-11*t,x+8*t,y-6*t);g.bezierCurveTo(x+8*t,y-2*t,x,y+1*t,x,y+5*t);g.closePath();g.fill();}
function rr(x,y,w,h,r){rrG(ctx,x,y,w,h,r);}
function rrG(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}

/* ============ 화면 전환 ============ */
function hideAll(){["start","shop","rank","over"].forEach(id=>document.getElementById(id).style.display="none");}
function closeOverlays(){hideAll();document.getElementById(state==="over"?"over":"start").style.display="flex";}
function goHome(){state="start";hideAll();document.getElementById("boostBtn").style.display="none";document.getElementById("quitBtn").style.display="none";
  refreshStart();document.getElementById("start").style.display="flex";}
function refreshStart(){
  document.getElementById("nick").value=SAVE.nick||"";
  document.getElementById("walletStart").textContent=SAVE.coins;
  document.getElementById("startBest").textContent=SAVE.best>0?"🏆 내 최고기록: "+SAVE.best+"점":"";

function startGame(){
  const v=(document.getElementById("nick").value||"").trim();
  if(v){SAVE.nick=v;save();}

}

/* ============ 상점 ============ */
function openShop(){hideAll();renderShop();const s=document.getElementById("shop");s.style.display="flex";s.scrollTop=0;}
function renderShop(){
  document.getElementById("walletShop").textContent=SAVE.coins;
  const grid=document.getElementById("shopGrid");grid.innerHTML="";
  SKINS.forEach(sk=>{
    const owned=SAVE.owned.includes(sk.id), sel=SAVE.skin===sk.id;
    const card=document.createElement("div");card.className="sk"+(sel?" sel":"");
    const locked=!owned&&sk.unlock;
    const cvp=document.createElement("canvas");cvp.width=64;cvp.height=84;
    if(locked)cvp.style.opacity=".4";
    const g=cvp.getContext("2d");g.translate(32,42);
    drawKartPreview(g,sk);
    card.appendChild(cvp);
    const nm=document.createElement("div");nm.className="kn";nm.textContent=sk.name;card.appendChild(nm);
    const pr=document.createElement("div");pr.className="kp";
    pr.textContent= owned?(sel?"장착중 ✓":"보유"): (sk.unlock?"🔒 잠김": (sk.price===0?"무료":"🪙 "+sk.price));
    card.appendChild(pr);
    if(sk.fx){const fb=document.createElement("div");fb.textContent="✨ 특수효과";fb.style.cssText="font-size:11px;color:#ffb703;margin:-2px 0 5px;font-family:var(--disp)";card.appendChild(fb);}
    const btn=document.createElement("button");
    if(owned){ if(sel){btn.className="using";btn.textContent="장착됨";}
      else{btn.className="use";btn.textContent="장착";btn.onclick=()=>{SAVE.skin=sk.id;save();cloudSaveProfile();renderShop();};} }
    else if(sk.unlock){ btn.className="buy";btn.disabled=true;btn.textContent=sk.unlock.label;btn.style.fontSize="12px"; }
    else{ btn.className="buy";btn.textContent="구매";
      if(SAVE.coins<sk.price){btn.disabled=true;btn.textContent="코인 부족";}
      btn.onclick=()=>{if(SAVE.coins>=sk.price){SAVE.coins-=sk.price;SAVE.owned.push(sk.id);SAVE.skin=sk.id;save();cloudSaveProfile();renderShop();}}; }
    card.appendChild(btn);
    grid.appendChild(card);
  });
}
function drawKartPreview(g,sk){
  // 배경 원
  g.save();g.fillStyle="rgba(255,255,255,.12)";g.beginPath();g.arc(0,0,30,0,7);g.fill();g.restore();
  const savedBoost=boosting;boosting=false; // 프리뷰는 불꽃 없이
  drawKart(g,0,0,0,sk);
  boosting=savedBoost;
}

async function submitScore(score){

// ===== 닉네임 기반 프로필(코인·스킨) 클라우드 저장 =====
let profileBusy=false;
async function cloudSaveProfile(){
  const nick=SAVE.nick; if(!nick)return;
  try{ await fetch(CLOUD.url+"/rest/v1/kart_save?on_conflict=nick",{method:"POST",
    headers:{...hdr(),Prefer:"resolution=merge-duplicates,return=minimal"},
    body:JSON.stringify({nick,coins:SAVE.coins,owned:SAVE.owned.join(","),skin:SAVE.skin})}); }catch(e){}
}
async function cloudLoadProfile(nick){
  if(!nick||profileBusy)return; profileBusy=true;
  try{
    const r=await fetch(CLOUD.url+"/rest/v1/kart_save?nick=eq."+encodeURIComponent(nick)+"&select=coins,owned,skin",{headers:hdr()});
    if(r.ok){ const rows=await r.json();
      if(rows&&rows[0]){ const s=rows[0];
        const serverOwned=(s.owned||"").split(",").filter(Boolean);
        SAVE.coins=s.coins||0;
        SAVE.owned=Array.from(new Set([...SAVE.owned,...serverOwned,"pink","sky"]));
        if(s.skin)SAVE.skin=s.skin;
        save(); refreshStart();
        await cloudSaveProfile();      // 합쳐진 목록 서버에 반영
      } else { await cloudSaveProfile(); } // 서버에 없으면 현재 데이터로 생성
    }
  }catch(e){} finally{ profileBusy=false; }
}
async function cloudTop(){try{const r=await fetch(CLOUD.url+"/rest/v1/kart_rank?select=nick,score&order=score.desc&limit=10",{headers:hdr()});
  if(!r.ok)return null;return await r.json();}catch(e){return null;}}
function medal(i){return i===0?"🥇":i===1?"🥈":i===2?"🥉":(i+1);}
function rankHTML(list){
  if(!list)return "<div class='rk'><div class='nm'>랭킹을 못 불러왔어 (오프라인일 수 있어)</div></div>";
  if(!list.length)return "<div class='rk'><div class='nm'>아직 기록이 없어. 1등 도전! 🏁</div></div>";
  return list.map((r,i)=>"<div class='rk"+(r.nick===SAVE.nick?" me":"")+"'><div class='no'>"+medal(i)+"</div><div class='nm'>"+esc(r.nick)+"</div><div class='sc'>"+r.score+"</div></div>").join("");
}
function esc(s){return (s||"").replace(/[<>&]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;"}[c]));}
function paintOverRank(list,score){document.getElementById("overRank").innerHTML="<div style='font-size:15px;margin-bottom:6px;opacity:.9'>🏆 전체 랭킹</div>"+rankHTML(list);}
async function openRank(){hideAll();const rk=document.getElementById("rank");rk.style.display="flex";rk.scrollTop=0;
  document.getElementById("rankList").innerHTML="<div class='rk'><div class='nm'>불러오는 중…</div></div>";
  const top=await cloudTop();document.getElementById("rankList").innerHTML=rankHTML(top);}

/* ============ 사운드 (Web Audio 합성) ============ */
const SND={ctx:null,master:null,muted:false,bgmOn:false};
try{SND.muted=!!SAVE.muted;}catch(e){}
function audioInit(){ if(SND.ctx)return; try{
  SND.ctx=new (window.AudioContext||window.webkitAudioContext)();
  SND.master=SND.ctx.createGain(); SND.master.gain.value=SND.muted?0:0.5; SND.master.connect(SND.ctx.destination);
}catch(e){} }
function beep(freq,dur,type,vol,when){ if(!SND.ctx||SND.muted||!freq)return;
  const t=when||SND.ctx.currentTime; const o=SND.ctx.createOscillator(),g=SND.ctx.createGain();
  o.type=type||"square"; o.frequency.setValueAtTime(freq,t);
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol||0.3,t+0.01); g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  o.connect(g); g.connect(SND.master); o.start(t); o.stop(t+dur+0.02); }
function sfx(kind){ if(!SND.ctx)audioInit(); if(!SND.ctx||SND.muted)return; const t=SND.ctx.currentTime;
  if(kind==="coin"){beep(880,0.07,"square",0.22,t);beep(1320,0.08,"square",0.2,t+0.05);}
  else if(kind==="power"){beep(660,0.06,"square",0.2,t);beep(990,0.08,"square",0.2,t+0.05);}
  else if(kind==="boost"){const o=SND.ctx.createOscillator(),g=SND.ctx.createGain();o.type="sawtooth";
    o.frequency.setValueAtTime(220,t);o.frequency.exponentialRampToValueAtTime(900,t+0.4);
    g.gain.setValueAtTime(0.3,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.5);o.connect(g);g.connect(SND.master);o.start(t);o.stop(t+0.52);}
  else if(kind==="crash"){const n=SND.ctx.sampleRate*0.3,buf=SND.ctx.createBuffer(1,n,SND.ctx.sampleRate),d=buf.getChannelData(0);
    for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2);
    const s=SND.ctx.createBufferSource();s.buffer=buf;const g=SND.ctx.createGain();g.gain.value=0.5;s.connect(g);g.connect(SND.master);s.start(t);beep(150,0.3,"square",0.3,t);}
  else if(kind==="unlock"){[523,659,784,1047].forEach((f,i)=>beep(f,0.18,"triangle",0.26,t+i*0.09));}
  else if(kind==="click"){beep(700,0.05,"square",0.18,t);}
  else if(kind==="chest"){[660,880,1175].forEach((f,i)=>beep(f,0.12,"triangle",0.26,t+i*0.07));}
}
// 칩튠 브금 루프
let bgmTimer=null,bgmStep=0;
const BGM_MEL=[392,0,523,0,659,523,587,0, 440,0,587,0,698,587,523,0, 392,0,523,0,659,784,659,0, 587,523,494,0,440,392,0,0];
const BGM_BASS=[131,131,165,165,175,175,147,147];
function bgmStart(){ if(SND.bgmOn||!SND.ctx)return; SND.bgmOn=true; bgmStep=0; bgmTick(); }
function bgmTick(){ if(!SND.bgmOn)return;
  if(!SND.muted){ const f=BGM_MEL[bgmStep%BGM_MEL.length], bf=BGM_BASS[bgmStep%BGM_BASS.length];
    if(f)beep(f,0.16,"square",0.09); beep(bf,0.2,"triangle",0.08); }
  bgmStep++; bgmTimer=setTimeout(bgmTick,175);
}
function toggleSound(){ audioInit(); SND.muted=!SND.muted; try{SAVE.muted=SND.muted;save();}catch(e){}
  if(SND.master)SND.master.gain.value=SND.muted?0:0.5;
  document.getElementById("sndBtn").textContent=SND.muted?"🔇":"🔊";
  if(!SND.muted){ if(SND.ctx&&SND.ctx.state==="suspended")SND.ctx.resume(); if(!SND.bgmOn)bgmStart(); } }
